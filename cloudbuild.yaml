steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - '${_REGISTRY}/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA'
      - '.'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGISTRY}/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA'

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGISTRY}/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--concurrency=32'
      - '--timeout=300'
      # MEMORY_BUDGET_MB is intentionally not set here: it is coupled to the
      # container's --memory shape, which lives on the live service config (not CI).
      # Setting it here would reset the budget on every deploy and could let
      # CompressionGate admit more concurrent work than the container can hold.
      - '--update-env-vars=MAX_QUEUE_DEPTH=32'
      - '--update-labels=commit-sha=$COMMIT_SHA'

substitutions:
  _DOCKERFILE: 'Dockerfile'
  _SERVICE: 'pare'
  _REGISTRY: 'gcr.io'
  _REGION: 'us-central1'
