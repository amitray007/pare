name: TEMP — Verify dependency bumps

# TEMPORARY WORKFLOW — delete before merging.
#
# Verifies the security bumps in this PR (Pillow 12.3.0, pillow-heif 1.6.0,
# pillow-avif-plugin pinned at 1.5.5) on clean Linux runners rather than a dev
# laptop.  It checks four claims the PR rests on:
#
#   1. The pinned plugin really holds libavif at 1.3.0 alongside Pillow 12.
#   2. AVIF optimizer output is byte-identical to the pre-bump stack.
#   3. The bench corpus builder still produces AVIF and HEIC (pillow-heif 1.x
#      dropped AVIF, so conversion.py now routes AVIF through pillow_avif).
#   4. The corpus pixel-hash contract still verifies under Pillow 12.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'requirements.txt'
      - 'bench/corpus/conversion.py'
      - '.github/workflows/verify-dep-bumps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: 1. Resolved versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert pinned encoder versions
        run: |
          python - <<'PY'
          import sys
          import PIL, pillow_heif, pillow_avif
          from pillow_avif import _avif

          libavif = _avif.libavif_version
          print(f"Pillow            {PIL.__version__}")
          print(f"pillow-heif       {pillow_heif.__version__}")
          print(f"pillow-avif-plugin {pillow_avif.__version__} (libavif {libavif})")

          fail = []
          if not PIL.__version__.startswith("12."):
              fail.append(f"expected Pillow 12.x, got {PIL.__version__}")
          if int(pillow_heif.__version__.split(".")[0]) < 1:
              fail.append(f"expected pillow-heif >=1.0, got {pillow_heif.__version__}")
          # The whole point of the pin: libavif 1.4.x retunes the quality scale
          # and shifts AVIF compression.  1.3.0 keeps current output.
          if not libavif.startswith("1.3."):
              fail.append(f"expected libavif 1.3.x (the pin), got {libavif}")

          # pillow-heif 1.x must NOT provide AVIF — conversion.py relies on this.
          if hasattr(pillow_heif, "register_avif_opener"):
              fail.append("pillow_heif unexpectedly still exposes register_avif_opener")

          if fail:
              print("\nFAILED:")
              for f in fail:
                  print(" -", f)
              sys.exit(1)
          print("\nAll version assertions passed.")
          PY

  avif-unchanged:
    name: 2. AVIF output byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant libjpeg-dev gifsicle

      - name: Generate AVIF fixtures + fingerprint on the OLD stack
        run: |
          python -m pip install --upgrade pip
          # Old stack: pre-bump pins from main.
          pip install -q "Pillow>=10.2.0,<11.0.0" "pillow-heif>=0.14.0,<1.0.0" \
                         "pillow-avif-plugin>=1.4.0,<2.0.0"
          pip install -q -r requirements-bench.txt
          # Everything optimizers/avif.py imports transitively.
          pip install -q fastapi "pydantic-settings>=2.1,<3" pyoxipng scour httpx \
                         "redis[hiredis]>=5,<6" scipy defusedxml python-multipart \
                         google-cloud-storage uvicorn
          mkdir -p /tmp/avif
          python .github/scripts/avif_fixtures.py /tmp/avif
          python .github/scripts/avif_fingerprint.py /tmp/avif /tmp/avif/before.json
          cat /tmp/avif/before.json

      - name: Fingerprint on the NEW stack
        run: |
          pip install -q -r requirements.txt
          python .github/scripts/avif_fingerprint.py /tmp/avif /tmp/avif/after.json
          cat /tmp/avif/after.json

      - name: Assert no AVIF drift
        run: |
          python - <<'PY'
          import json, sys
          before = json.load(open("/tmp/avif/before.json"))
          after = json.load(open("/tmp/avif/after.json"))
          print(f"Pillow {before['pillow']} -> {after['pillow']}")
          print(f"libavif {before['libavif']} -> {after['libavif']}")

          diffs = []
          for key, old in before["results"].items():
              new = after["results"].get(key)
              if new != old:
                  diffs.append((key, old, new))

          n = len(before["results"])
          if diffs:
              print(f"\n{len(diffs)}/{n} AVIF outputs CHANGED:")
              for key, old, new in diffs:
                  print(f"  {key}\n    before {old}\n    after  {new}")
              sys.exit(1)
          print(f"\nAll {n} AVIF outputs byte-identical across the bump.")
          PY

  corpus:
    name: 3. Bench corpus builds AVIF + HEIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-bench.txt

      - name: Encoders register and produce output
        run: |
          python - <<'PY'
          import sys
          import numpy as np
          from PIL import Image
          from bench.corpus import conversion as C

          print(f"HEIC={C._HEIC_AVAILABLE} AVIF={C._AVIF_AVAILABLE} JXL={C._JXL_AVAILABLE}")
          fail = []
          if not C._AVIF_AVAILABLE:
              fail.append("AVIF encoder unavailable (pillow_avif did not register)")
          if not C._HEIC_AVAILABLE:
              fail.append("HEIC encoder unavailable")

          img = Image.new("RGB", (64, 48), (90, 140, 200))
          for name, fn in (("AVIF", C._encode_avif), ("HEIC", C._encode_heic)):
              try:
                  print(f"  8-bit {name}: {len(fn(img))} bytes")
              except Exception as exc:
                  fail.append(f"8-bit {name} encode failed: {exc}")

          # Deep colour: HEIC keeps 10-bit; AVIF downshifts to 8-bit by design.
          rng = np.random.default_rng(1)
          arr = (rng.random((48, 64, 3)) * 1023).astype(np.uint16)
          for name, fn in (("AVIF", C._encode_avif), ("HEIC", C._encode_heic)):
              try:
                  print(f"  deep-colour {name}: {len(fn(arr))} bytes")
              except Exception as exc:
                  fail.append(f"deep-colour {name} encode failed: {exc}")

          if fail:
              print("\nFAILED:")
              for f in fail:
                  print(" -", f)
              sys.exit(1)
          print("\nAll corpus encoders OK.")
          PY

      - name: Build the full core corpus
        run: python -m bench.corpus build --manifest core --force

      - name: Verify manifest pixel hashes
        run: python -m bench.corpus verify --manifest core

  tests:
    name: 4. Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant libjpeg-dev gifsicle

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-bench.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint
        run: python -m ruff check . && python -m black --check .
